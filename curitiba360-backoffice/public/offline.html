<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curitiba 360 - Modo Offline 📶</title>
  <style>
    body {
      background-color: #0F172A;
      color: #FFFFFF;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 32px;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 { font-size: 24px; margin-bottom: 12px; }
    p { color: #94A3B8; font-size: 14px; line-height: 1.5; }
    .badge {
      background: #3B82F6;
      color: #FFF;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 16px;
    }
    button {
      margin-top: 24px;
      background: #2563EB;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">MODO OFFLINE</span>
    <h1>Sem conexão com a internet</h1>
    <p>Você está desconectado. Seus ingressos baixados e QR Codes previamente carregados continuam disponíveis na sua carteira digital.</p>
    <button onclick="window.location.reload()">Tentar Reconectar</button>
  </div>
</body>
</html>
